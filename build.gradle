plugins {
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "1.9.10"
    id "org.jetbrains.kotlin.kapt" version "1.9.10"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

allprojects {
    group "gg.scala.queue"
    version "1.0.1"

    repositories {
        mavenLocal()
        mavenCentral()

        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
        maven { url "https://oss.sonatype.org/content/repositories/central" }
        maven { url "https://repo.viaversion.com/" }

        maven {
            name "Scala"
            url "${property("artifactory_contextUrl")}/gradle-release"

            credentials {
                username property("artifactory_user")
                password property("artifactory_password")
            }
        }
    }
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jetbrains.kotlin.kapt"
    apply plugin: "com.github.johnrengelman.shadow"

    dependencies {
        compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.7.22"

        compileOnly "gg.scala.aware:aware:1.0.8.3"
        compileOnly "gg.scala.commons:serializers:3.0.7"

        if (project.name == "spigot")
        {
            compileOnly "gg.scala.commons:bukkit:3.0.7"
            kapt "gg.scala.commons:bukkit:3.0.7"

            compileOnly "gg.scala.store:spigot:0.1.3"
            compileOnly "gg.scala.lemon:bukkit:1.5.1"
            compileOnly "gg.scala.spigot:server:1.1.0"

            compileOnly "io.lettuce:lettuce-core:6.2.0.RELEASE"
            compileOnly "gg.scala.cloudsync:spigot:1.0.1"
        } else if (project.name == "server")
        {
            api "org.jetbrains.kotlin:kotlin-stdlib:1.7.22"

            api "gg.scala.aware:aware:1.0.8.3"
            api "gg.scala.commons:serializers:3.1.9"

            api "com.google.code.gson:gson:2.9.0"
            api "gg.scala.commons:serversync:3.3.1"
            api "io.lettuce:lettuce-core:6.2.0.RELEASE"

            api "net.kyori:adventure-key:4.11.0"
            api "net.kyori:adventure-text-serializer-gson:4.11.0"
        } else
        {
            compileOnly "gg.scala.commons:serversync:3.3.1"
        }

        if (project.name != "shared")
        {
            api project(":shared")
        }
    }

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "17"
    }

    shadowJar {
        archiveClassifier.set("")

        exclude "**/*.kotlin_metadata"
        exclude "**/*.kotlin_builtins"
        exclude "META-INF/"

        archiveFileName = "scala-queue-${project.name}.jar"
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                project.shadow.component(publication)
            }
        }

        repositories {
            maven {
                name "scala"
                url "$artifactory_contextUrl/$artifactory_release"

                credentials {
                    username property("artifactory_user")
                    password property("artifactory_password")
                }
            }
        }
    }

    tasks.build.dependsOn(
        shadowJar,
        publishShadowPublicationToScalaRepository
    )
}
